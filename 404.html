<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Cast has moved</title>
<style>
html,body{margin:0;height:100%;background:#0b1630;color:#eaf5ff;font:16px/1.5 monospace}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
h1{color:#ffc94a;font-size:22px;margin:0;letter-spacing:2px}
a{color:#8ed0ee}
</style></head>
<body><main>
<h1>ONE CAST HAS MOVED</h1>
<p id="msg">Bringing your fish with you...</p>
<p><a id="go" href="#">Tap here if nothing happens</a></p>
</main>
<script>
/* The new home of the game. Your save travels in the part after #, which never leaves your browser. */
var NEW='https://onecast.github.io/';
var url=NEW;
try{ var v=JSON.parse(localStorage.getItem('onecast.id')||'null'); if(v&&v.pid&&v.secret) url=NEW+'#move='+encodeURIComponent('OC1.'+v.pid+'.'+v.secret); }catch(e){}
document.getElementById('go').href=url;
location.replace(url);
</script>
</body></html>
